name: Deploy EARTHY

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "배포 대상"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::121701583863:role/earthy-github-actions-role
  ECR_REGISTRY: 121701583863.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: earthy-shop-backend
  BACKEND_IMAGE: 121701583863.dkr.ecr.ap-northeast-2.amazonaws.com/earthy-shop-backend:latest
  EC2_INSTANCE_ID: i-0d98ed6719857da7c
  FRONTEND_BUCKET: earthy-shop-web
  CLOUDFRONT_DISTRIBUTION_ID: E3JN1ZX1QGUVOL

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'backend' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build backend image
        run: |
          docker build -t "$BACKEND_IMAGE" .

      - name: Push backend image
        run: |
          docker push "$BACKEND_IMAGE"

      - name: Deploy backend on EC2 through SSM
        run: |
          cat > ssm-backend-deploy.json <<JSON
          {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["${EC2_INSTANCE_ID}"],
            "Comment": "Deploy EARTHY backend ${GITHUB_SHA}",
            "Parameters": {
              "commands": [
                "set -e",
                "sudo -u ubuntu git -C /home/ubuntu/earthy-shop pull --ff-only origin main",
                "cd /home/ubuntu/earthy-shop",
                "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
                "export BACKEND_IMAGE=${BACKEND_IMAGE}",
                "docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull backend",
                "docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build mysql backend",
                "docker compose -f docker-compose.yml -f docker-compose.deploy.yml ps"
              ]
            }
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-backend-deploy.json \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'frontend' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PORTONE_STORE_ID: ${{ secrets.VITE_PORTONE_STORE_ID }}
          VITE_PORTONE_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_CHANNEL_KEY }}
          VITE_PORTONE_REDIRECT_URL: ${{ secrets.VITE_PORTONE_REDIRECT_URL }}
        run: pnpm build

      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/dist "s3://${FRONTEND_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
