spring:
  application:
    name: earthy-shop

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/earthy_shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:your_username}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

server:
  port: ${SERVER_PORT:8080}

admin:
  email: ${ADMIN_EMAIL:your-admin-email@example.com}
  password: ${ADMIN_PASSWORD:your-admin-password}
  sync-password: ${ADMIN_SYNC_PASSWORD:false}

jwt:
  secret: ${JWT_SECRET:your-base64-secret}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

portone:
  store-id: ${PORTONE_STORE_ID:your-portone-store-id}
  channel-key: ${PORTONE_CHANNEL_KEY:your-portone-channel-key}
  api-secret: ${PORTONE_API_SECRET:your-portone-api-secret}

brevo:
  api-key: ${BREVO_API_KEY:your-brevo-api-key}
  sender-name: ${BREVO_SENDER_NAME:EARTHY}
  sender-email: ${BREVO_SENDER_EMAIL:your-sender-email@example.com}

solapi:
  enabled: ${SOLAPI_ENABLED:false}
  api-key: ${SOLAPI_API_KEY:your-solapi-api-key}
  api-secret: ${SOLAPI_API_SECRET:your-solapi-api-secret}
  pf-id: ${SOLAPI_PF_ID:your-solapi-pf-id}
  sender-phone: ${SOLAPI_SENDER_PHONE:your-sender-phone}
  template:
    order-completed: ${SOLAPI_TEMPLATE_ORDER_COMPLETED:your-order-completed-template-id}
    shipping-started: ${SOLAPI_TEMPLATE_SHIPPING_STARTED:your-shipping-started-template-id}
    canceled-customer: ${SOLAPI_TEMPLATE_CANCELED_CUSTOMER:your-canceled-customer-template-id}
    canceled-admin: ${SOLAPI_TEMPLATE_CANCELED_ADMIN:your-canceled-admin-template-id}

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY:your-aws-access-key}
    secret-key: ${AWS_S3_SECRET_KEY:your-aws-secret-key}
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:your-s3-bucket}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:https://your-s3-bucket.s3.ap-northeast-2.amazonaws.com}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:your-kakao-rest-api-key}
    client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/oauth/kakao/callback}
    frontend-redirect-uri: ${KAKAO_FRONTEND_REDIRECT_URI:http://localhost:5175/auth}

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
