spring:
  application:
    name: earthy-shop

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  sync-password: ${ADMIN_SYNC_PASSWORD:false}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

portone:
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  api-secret: ${PORTONE_API_SECRET}

brevo:
  api-key: ${BREVO_API_KEY}
  sender-name: ${BREVO_SENDER_NAME:EARTHY}
  sender-email: ${BREVO_SENDER_EMAIL}

solapi:
  enabled: ${SOLAPI_ENABLED:false}
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  pf-id: ${SOLAPI_PF_ID:}
  sender-phone: ${SOLAPI_SENDER_PHONE:}
  template:
    order-completed: ${SOLAPI_TEMPLATE_ORDER_COMPLETED:}
    shipping-started: ${SOLAPI_TEMPLATE_SHIPPING_STARTED:}
    canceled-customer: ${SOLAPI_TEMPLATE_CANCELED_CUSTOMER:}
    canceled-admin: ${SOLAPI_TEMPLATE_CANCELED_ADMIN:}

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    frontend-redirect-uri: ${KAKAO_FRONTEND_REDIRECT_URI}

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
